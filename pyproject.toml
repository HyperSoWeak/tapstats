[project]
name = "tapstats"
version = "0.1.0"
description = "Keyboard and mouse input statistics for Wayland"
requires-python = ">=3.11"
dependencies = ["evdev", "textual"]

[project.scripts]
tapstats = "tapstats.panel:main"
tapstats-daemon = "tapstats.daemon:main"
tapstats-waybar = "tapstats.waybar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tapstats"]
